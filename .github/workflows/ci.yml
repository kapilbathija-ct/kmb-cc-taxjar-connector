name: CI

on: [push]

jobs:
  build-tax-calculator:
    name: Build the application for tax-calculator
    runs-on: ubuntu-latest
    env:
      CTP_CLIENT_ID: ${{ secrets.CTP_CLIENT_ID }}
      CTP_CLIENT_SECRET: ${{ secrets.CTP_CLIENT_SECRET }}
      CTP_PROJECT_KEY: ${{ secrets.CTP_PROJECT_KEY }}
      CTP_SCOPE: ${{ secrets.CTP_SCOPE }}
      CTP_REGION: ${{ secrets.CTP_REGION }}
      TAX_PROVIDER_API_TOKEN: ${{ secrets.TAX_PROVIDER_API_TOKEN }}
      TAX_PROVIDER_ENV: ${{ secrets.TAX_PROVIDER_ENV }}
      TAXJAR_FROM_COUNTRY: ${{ secrets.TAXJAR_FROM_COUNTRY }}
      TAXJAR_FROM_STATE: ${{ secrets.TAXJAR_FROM_STATE }}
      EXTENSION_AUTH_TOKEN: ${{ secrets.EXTENSION_AUTH_TOKEN }}
    defaults:
      run:
        working-directory: tax-calculator
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install modules
        run: npm ci

      - name: Check the coding style
        run: npm run lint && npm run prettier:check

      - name: Execute tests
        run: npm run test:ci

  build-order-syncer:
    name: Build the application for order-syncer
    runs-on: ubuntu-latest
    env:
      CTP_CLIENT_ID: ${{ secrets.CTP_CLIENT_ID }}
      CTP_CLIENT_SECRET: ${{ secrets.CTP_CLIENT_SECRET }}
      CTP_PROJECT_KEY: ${{ secrets.CTP_PROJECT_KEY }}
      CTP_SCOPE: ${{ secrets.CTP_SCOPE }}
      CTP_REGION: ${{ secrets.CTP_REGION }}
      TAX_PROVIDER_API_TOKEN: ${{ secrets.TAX_PROVIDER_API_TOKEN }}
      TAX_PROVIDER_ENV: ${{ secrets.TAX_PROVIDER_ENV }}
      TAXJAR_FROM_COUNTRY: ${{ secrets.TAXJAR_FROM_COUNTRY }}
      TAXJAR_FROM_STATE: ${{ secrets.TAXJAR_FROM_STATE }}
      CONNECT_SUBSCRIPTION_DESTINATION: ${{ secrets.CONNECT_SUBSCRIPTION_DESTINATION }}
    defaults:
      run:
        working-directory: order-syncer
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install modules
        run: npm ci

      - name: Check the coding style
        run: npm run lint && npm run prettier:check

      - name: Execute tests
        run: npm run test:ci